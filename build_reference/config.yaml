# Genome version for validation (must be in can_use_genome_version)
Genome_Version: GRCm39

# Supported genome versions list
# Add your custom version here to pass validation
can_use_genome_version:
  - GRCm39

# DEG enrichment gene identifier column
# Common values: 'Entrez ID', 'ENSEMBL', 'SYMBOL'
gene_col: 'ENSEMBL'

# Genome ploidy for variant calling
ploidy: 2

Reference:
  info:
    name: GRCm39
    prefix: GRCm39_RNAFlow_Index
    description: Mouse reference genome (GRCm39)
    # Base directory for reference outputs. This should match the main
    # pipeline's reference_path (config/reference.yaml). The workflow will
    # create a subdirectory named after 'name' (e.g. GRCm39) under this path.
    workflow: /path/to/reference/RNAFlow_reference
  data_dir:
    # Replace with the actual genome FASTA/GTF/GFF and gene-GO annotation paths.
    fa: /path/to/genome/GRCm39.genome.fa
    gff: /path/to/genome/gencode.vM38.annotation.gff3
    gtf: /path/to/genome/gencode.vM38.annotation.gtf
    go: /path/to/genome/mgigene_go_annotation.tsv
